<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VM Collector — Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #06182b;
            color: #f3f4f6;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 470px;
            padding: 20px;
            background: transparent;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .brand {
            text-align: center;
            margin-bottom: 38px;
        }

        .brand img {
            width: 112px;
            height: 112px;
            object-fit: contain;
            display: block;
            margin: 0 auto 20px;
        }

        .brand h1 {
            margin: 0;
            color: #f9fafb;
            font-size: 28px;
            font-weight: 650;
            letter-spacing: -0.4px;
        }

        .brand p {
            margin: 8px 0 0;
            color: #8fa1b5;
            font-size: 14px;
        }

        .field {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 15px;
            font-weight: 500;
            color: #b8c5d3;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #587087;
            border-radius: 3px;
            background: #203b53;
            color: #f8fafc;
            font-size: 16px;
            outline: none;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }

        input::placeholder {
            color: #8fa1b5;
        }

        input:focus {
            border-color: #4f9cff;
            background: #27455f;
            box-shadow: 0 0 0 2px rgba(37, 139, 255, .18);
        }

        button {
            width: 100%;
            height: 50px;
            margin-top: 4px;
            border: 0;
            border-radius: 3px;
            background: #0878f9;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .4px;
            cursor: pointer;
            transition: background .15s, box-shadow .15s;
        }

        button:hover {
            background: #1684ff;
            box-shadow: 0 4px 18px rgba(8, 120, 249, .25);
        }

        button:disabled {
            opacity: .65;
            cursor: default;
        }

        .error {
            display: none;
            margin-bottom: 20px;
            padding: 11px 13px;
            border-radius: 3px;
            background: rgba(220, 38, 38, .12);
            border: 1px solid rgba(248, 113, 113, .45);
            color: #fca5a5;
            font-size: 13px;
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            color: #71849a;
            font-size: 12px;
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #71849a;
            font-size: 10px;
            line-height: 1;
            text-decoration: none;
            opacity: 0.7;
        }

        .github-link svg {
            width: 11px;
            height: 11px;
            flex: 0 0 11px;
            fill: currentColor;
        }

        .github-link:hover {
            color: #9db1c7;
            opacity: 1;
        }

        @media (max-width: 520px) {
            .login-card {
                max-width: 100%;
                padding: 10px;
            }

            .brand img {
                width: 96px;
                height: 96px;
            }

            .brand h1 {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand">
            <img src="/static/vmcollector-icon.png" alt="VM Collector">
            <h1>VM Collector</h1>
            <p>Administrator sign in</p>
        </div>

        <div id="error" class="error"></div>

        <form id="login-form">
            <div class="field">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    value="admin"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button id="login-button" type="submit">Sign in</button>
        </form>

        <div class="footer">
            <a class="github-link"
               href="https://github.com/Dorozhko/vmcollector"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="@Dorozhko on GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.16c-3.2.69-3.87-1.54-3.87-1.54-.53-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.24 3.32.95.1-.74.4-1.24.73-1.53-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.07.78 2.16v3.2c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
                </svg>
                <span>@Dorozhko</span>
            </a>
        </div>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const error = document.getElementById("error");
        const button = document.getElementById("login-button");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            error.style.display = "none";
            button.disabled = true;
            button.textContent = "Signing in...";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: document.getElementById("password").value
                    })
                });

                if (!response.ok) {
                    throw new Error("Invalid username or password");
                }

                window.location.href = "/";
            } catch (err) {
                error.textContent = err.message;
                error.style.display = "block";
                button.disabled = false;
                button.textContent = "Sign in";
            }
        });
    </script>
</body>
</html>
