<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VM Collector — Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #06182b;
            color: #f3f4f6;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 470px;
            padding: 20px;
            background: transparent;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .brand {
            text-align: center;
            margin-bottom: 38px;
        }

        .brand img {
            width: 112px;
            height: 112px;
            object-fit: contain;
            display: block;
            margin: 0 auto 20px;
        }

        .brand h1 {
            margin: 0;
            color: #f9fafb;
            font-size: 28px;
            font-weight: 650;
            letter-spacing: -0.4px;
        }

        .brand p {
            margin: 8px 0 0;
            color: #8fa1b5;
            font-size: 14px;
        }

        .field {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 15px;
            font-weight: 500;
            color: #b8c5d3;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #587087;
            border-radius: 3px;
            background: #203b53;
            color: #f8fafc;
            font-size: 16px;
            outline: none;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }

        input::placeholder {
            color: #8fa1b5;
        }

        input:focus {
            border-color: #4f9cff;
            background: #27455f;
            box-shadow: 0 0 0 2px rgba(37, 139, 255, .18);
        }

        button {
            width: 100%;
            height: 50px;
            margin-top: 4px;
            border: 0;
            border-radius: 3px;
            background: #0878f9;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .4px;
            cursor: pointer;
            transition: background .15s, box-shadow .15s;
        }

        button:hover {
            background: #1684ff;
            box-shadow: 0 4px 18px rgba(8, 120, 249, .25);
        }

        button:disabled {
            opacity: .65;
            cursor: default;
        }

        .error {
            display: none;
            margin-bottom: 20px;
            padding: 11px 13px;
            border-radius: 3px;
            background: rgba(220, 38, 38, .12);
            border: 1px solid rgba(248, 113, 113, .45);
            color: #fca5a5;
            font-size: 13px;
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            color: #71849a;
            font-size: 12px;
        }

        @media (max-width: 520px) {
            .login-card {
                max-width: 100%;
                padding: 10px;
            }

            .brand img {
                width: 96px;
                height: 96px;
            }

            .brand h1 {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand">
            <img src="/static/vmcollector-icon.png" alt="VM Collector">
            <h1>VM Collector</h1>
            <p>Administrator sign in</p>
        </div>

        <div id="error" class="error"></div>

        <form id="login-form">
            <div class="field">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    value="admin"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button id="login-button" type="submit">Sign in</button>
        </form>

        <div class="footer">
            VM Collector
        </div>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const error = document.getElementById("error");
        const button = document.getElementById("login-button");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            error.style.display = "none";
            button.disabled = true;
            button.textContent = "Signing in...";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: document.getElementById("password").value
                    })
                });

                if (!response.ok) {
                    throw new Error("Invalid username or password");
                }

                window.location.href = "/";
            } catch (err) {
                error.textContent = err.message;
                error.style.display = "block";
                button.disabled = false;
                button.textContent = "Sign in";
            }
        });
    </script>
</body>
</html>
