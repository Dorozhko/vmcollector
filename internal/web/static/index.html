<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VM Collector</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header class="topbar">
    <div class="brand">
        <img class="collector-icon-image" src="/static/vmcollector-icon.png" alt="VM Collector">
        <div>
            <h1>VM Collector</h1>
            <div class="status-line">
                <span id="status-dot" class="status-dot"></span>
                <span id="status">Loading...</span>
            </div>
        </div>
    </div>

    <div class="top-actions">
        <div class="error-counter">
            Errors:
            <strong id="error-count">0</strong>
        </div>
        <button id="save" class="primary">Save & Apply</button>
    </div>
</header>

<main>

    <!-- Metrics -->
    <section class="panel">
        <div class="section-head">
            <div>
                <h2>Metrics</h2>
                <div class="section-subtitle">
                    Modbus TCP and system metrics
                </div>
            </div>

            <button id="add" class="primary">
                + Add Metric
            </button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>On</th>
                    <th>Status</th>
                    <th>Name</th>
                    <th>Source</th>
                    <th>Metric</th>
                    <th>Details</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody id="rows"></tbody>
            </table>
        </div>

    </section>


    <!-- Victoria Metrics -->
    <section class="panel vm-panel">
        <div class="vm-settings">
            <div class="vm-settings-form">

                <div class="vm-field">
                    <label for="vm-address">Victoria Metrics API:Port</label>
                    <input
                        id="vm-address"
                        type="text"
                        placeholder="http://127.0.0.1:8428"
                    >
                </div>

                <div class="vm-enabled-field">
                    <label>Connection</label>

                    <div class="vm-connection-control">

                        <label class="vm-switch">
                            <input
                                id="vm-toggle"
                                class="vm-switch-input"
                                type="checkbox"
                            >
                            <span class="vm-switch-slider"></span>
                        </label>

                        <span id="vm-toggle-label" class="vm-toggle-text">
                            OFF
                        </span>

                        <span id="vm-status" class="vm-status disabled">
                            <span class="vm-status-dot"></span>
                            <span id="vm-status-text">Disabled</span>
                        </span>

                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Error Logs -->
    <section class="panel">


        <div class="section-head logs-head">
            <div>
                <h2>Error Logs</h2>
                <div class="section-subtitle">
                    Last 100 collector messages
                </div>
            </div>

            <div class="log-filters">
                <button class="filter active" data-level="all">All</button>
                <button class="filter" data-level="info">Info</button>
                <button class="filter" data-level="warning">Warning</button>
                <button class="filter" data-level="error">Error</button>
                <button class="clear-logs" id="clear-logs">Clear Logs</button>
            </div>
        </div>

        <div id="logs" class="logs"></div>

    </section>

    <!-- Advanced configuration -->
    <section class="panel advanced">

        <button id="json-toggle" class="advanced-toggle">
            <span>▸</span>
            Configuration JSON
        </button>

        <div id="json-container" class="json-container hidden">
            <textarea id="json" spellcheck="false"></textarea>
        </div>

    </section>

    <footer class="project-footer">
        <a class="github-link"
           href="https://github.com/Dorozhko/vmcollector"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="@Dorozhko on GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.16c-3.2.69-3.87-1.54-3.87-1.54-.53-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.24 3.32.95.1-.74.4-1.24.73-1.53-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.07.78 2.16v3.2c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
            </svg>
            <span>@Dorozhko</span>
        </a>
    </footer>

</main>

<!-- Metric editor -->
<div id="modal" class="modal hidden">

    <div class="modal-backdrop"></div>

    <div class="modal-window">

        <div class="modal-header">
            <h2 id="modal-title">Add Metric</h2>
            <button id="modal-close" class="icon-button">×</button>
        </div>

        <div class="form">

            <div class="field">
                <label>Name</label>
                <input id="f-name" type="text">
            </div>

            <div class="field">
                <label>Source</label>
                <select id="f-source">
                    <option value="cpu">CPU</option>
                    <option value="memory">Memory</option>
                    <option value="storage">Storage</option>
                    <option value="temperature">Temperature</option>
                    <option value="network">Network</option>
                    <option value="uptime">Uptime</option>
                    <option value="file">File</option>
                    <option value="modbus">Modbus TCP</option>
                </select>
            </div>

            <div id="dynamic-fields"></div>

            <div class="field">
                <label for="f-poll-interval">Poll Interval</label>
                <div class="poll-interval-row">
                    <input
                        id="f-poll-interval"
                        type="number"
                        min="1"
                        max="3600000"
                        step="1"
                        value="5"
                    >
                    <select id="f-poll-unit">
                        <option value="ms">Milliseconds</option>
                        <option value="s" selected>Seconds</option>
                        <option value="m">Minutes</option>
                    </select>
                </div>
            </div>

        </div>

        <div class="modal-footer">
            <button id="modal-cancel">Cancel</button>
            <button id="modal-save" class="primary">Save Metric</button>
        </div>

    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
