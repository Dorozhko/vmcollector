name: vmcollector
title: VM Collector
base: core24
version: '0.1.0'
summary: Lightweight Modbus TCP collector for VictoriaMetrics
description: |
  Lightweight Go Modbus TCP collector with direct VictoriaMetrics Remote Write output.
confinement: strict

platforms:
  riscv64:
    build-on: [arm64]
    build-for: [riscv64]

apps:
  daemon:
    command: bin/vmcollector-launch
    daemon: simple
    plugs:
      - network
      - network-bind

  set-admin-password:
    command: bin/vmcollector-set-admin-password

  set-port:
    command: bin/vmcollector-set-port

parts:
  vmcollector:
    plugin: dump
    source: snap/local/stage
