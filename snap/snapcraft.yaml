name: vmcollector
title: VM Collector
base: core24
version: '0.1.0'
summary: Lightweight Modbus TCP collector for VictoriaMetrics
description: |
  Lightweight Go Modbus TCP collector with direct VictoriaMetrics Remote Write output.
confinement: strict

platforms:
  riscv64:
    build-on:
      - arm64
    build-for:
      - riscv64


apps:
  daemon:
    command: bin/vmcollector-launch
    daemon: simple
    plugs:
      - network
      - network-bind

parts:
  vmcollector:
    plugin: go
    source: https://github.com/Dorozhko/vmcollector.git
    build-snaps:
      - go/1.26/stable
    build-packages:
      - git
    override-build: |
      export GOOS=linux
      export GOARCH=riscv64
      export CGO_ENABLED=0
      install -m 0755 snap/local/vmcollector-launch "$SNAPCRAFT_PART_INSTALL/bin/vmcollector-launch"
      go build -trimpath -ldflags='-s -w' -o "$SNAPCRAFT_PART_INSTALL/bin/vmcollector" ./cmd/vmcollector
